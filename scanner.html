<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>QRスキャン / QR Scan</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .frame { position: relative; width: 100%; max-width: 480px; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 16px; background: #111; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  canvas { display: none; }
  .guide {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 62%; aspect-ratio: 1 / 1; border: 3px solid rgba(255,255,255,0.85);
    border-radius: 16px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35);
    pointer-events: none;
  }
  .msg { margin-top: 18px; font-size: 17px; text-align: center; padding: 0 24px; line-height: 1.6; }
  .hint { margin-top: 6px; font-size: 13px; color: #aaa; text-align: center; padding: 0 24px; line-height: 1.5; }
  .cancel {
    margin-top: 26px; padding: 14px 32px; border-radius: 999px; border: none;
    background: #333; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

  <div class="frame">
    <video id="video" autoplay playsinline muted></video>
    <div class="guide"></div>
  </div>
  <div class="msg" id="msg">カメラを起動しています…</div>
  <div class="hint">QRコードを枠の中に、15〜20cmほど離してかざしてください<br>(Hold the QR code inside the frame, about 15-20cm away)</div>
  <canvas id="canvas"></canvas>
  <button class="cancel" onclick="cancelScan()">キャンセルして戻る</button>

  <!-- QRコードを解析するための無料ライブラリ（jsQR） -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    // URLの ?return=...&dept=...&label=... を受け取る
    const params = new URLSearchParams(location.search);
    const returnUrl = params.get('return');
    const dept = params.get('dept') || '';
    const label = params.get('label') || '';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const msg = document.getElementById('msg');

    let scanning = true;
    let currentStream = null;

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(function (t) { t.stop(); });
        currentStream = null;
      }
    }

    function cancelScan() {
      stopCamera();
      if (returnUrl) {
        location.href = returnUrl;
      }
    }

    // facingMode: 'user' = インカメラ（前面カメラ）。
    // 解像度をできるだけ高く要求し、可能ならピント調整も有効にすることで、
    // 近距離のQRコードでも読み取りやすくする。
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ focusMode: 'continuous' }]
      }
    })
      .then(function (stream) {
        currentStream = stream;
        video.srcObject = stream;
        msg.textContent = 'QRコードをカメラにかざしてください\n(Please hold your QR code up to the camera)';
        requestAnimationFrame(tick);
      })
      .catch(function (err) {
        msg.textContent = 'カメラを起動できませんでした。iPadの「設定」→ このブラウザのカメラ許可をご確認ください。\n(' + err.message + ')';
      });

    function tick() {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // 画面中央の「枠」に対応する領域だけを切り出して解析する。
        // 全体を解析するより、対象がはっきりした部分だけを見る方が
        // 認識の精度・速度が上がりやすい。
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const guideRatio = 0.62; // .guide の width と揃える
        const size = Math.round(Math.min(vw, vh) * guideRatio);
        const sx = Math.round((vw - size) / 2);
        const sy = Math.round((vh - size) / 2);

        canvas.width = size;
        canvas.height = size;
        ctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
        const imageData = ctx.getImageData(0, 0, size, size);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
        if (code && code.data) {
          scanning = false;
          onScanned(code.data);
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    function onScanned(value) {
      msg.textContent = '読み取りました: ' + value + '\n受付画面に戻ります…';
      stopCamera();
      if (!returnUrl) return;
      const url = returnUrl
        + '?scanned=' + encodeURIComponent(value)
        + '&dept=' + encodeURIComponent(dept)
        + '&label=' + encodeURIComponent(label);
      setTimeout(function () { location.href = url; }, 500);
    }
  </script>

</body>
</html>

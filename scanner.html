<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>QRスキャン / QR Scan</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #000; color: #fff;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
  }

  /* カメラ映像を画面いっぱいに表示する（全画面スキャナー方式） */
  #video {
    position: fixed; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  canvas { display: none; }

  /* 中央の読み取り枠（映像の上に重ねる。画面の短辺を基準に大きめに） */
  .guide {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(86vw, 86vh); aspect-ratio: 1 / 1;
    border: 4px solid rgba(255,255,255,0.9);
    border-radius: 20px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4);
    pointer-events: none;
  }

  /* 下部の案内文・ボタンは映像の上に重ねる帯として表示 */
  .bottom-bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 18px 20px calc(24px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    text-align: center;
  }
  .msg { font-size: 18px; line-height: 1.5; margin-bottom: 6px; }
  .hint { font-size: 13px; color: #ccc; line-height: 1.5; margin-bottom: 16px; }
  .cancel {
    padding: 14px 32px; border-radius: 999px; border: none;
    background: rgba(255,255,255,0.15); color: #fff; font-size: 16px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

  <video id="video" autoplay playsinline muted></video>
  <div class="guide"></div>
  <canvas id="canvas"></canvas>

  <div class="bottom-bar">
    <div class="msg" id="msg">カメラを起動しています…</div>
    <div class="hint">QRコードを枠の中に、15〜20cmほど離してかざしてください<br>(Hold the QR code inside the frame, about 15-20cm away)</div>
    <button class="cancel" onclick="cancelScan()">キャンセルして戻る</button>
  </div>

  <!-- QRコードを解析するための無料ライブラリ（jsQR） -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
  <script>
    // URLの ?return=...&dept=...&label=... を受け取る
    const params = new URLSearchParams(location.search);
    const returnUrl = params.get('return');
    const dept = params.get('dept') || '';
    const label = params.get('label') || '';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const msg = document.getElementById('msg');

    let scanning = true;
    let currentStream = null;

    function stopCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(function (t) { t.stop(); });
        currentStream = null;
      }
    }

    function cancelScan() {
      stopCamera();
      if (returnUrl) {
        location.href = returnUrl;
      }
    }

    // facingMode: 'user' = インカメラ（前面カメラ）。
    // 解像度をできるだけ高く要求し、可能ならピント調整も有効にすることで、
    // 近距離のQRコードでも読み取りやすくする。
    navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'user',
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        advanced: [{ focusMode: 'continuous' }]
      }
    })
      .then(function (stream) {
        currentStream = stream;
        video.srcObject = stream;
        msg.textContent = 'QRコードをカメラにかざしてください\n(Please hold your QR code up to the camera)';
        requestAnimationFrame(tick);
      })
      .catch(function (err) {
        msg.textContent = 'カメラを起動できませんでした。iPadの「設定」→ このブラウザのカメラ許可をご確認ください。\n(' + err.message + ')';
      });

    function tick() {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        // 画面中央の「枠」に対応する領域だけを切り出して解析する。
        // .guide は画面の短辺（vw/vhの小さい方）の86%の正方形。
        // object-fit:cover のビデオは縦横同じ拡大率で表示されるため、
        // ビデオのネイティブ解像度でも同じ割合（86%）を切り出せばよい。
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const guideRatio = 0.86; // .guide の min(86vw,86vh) と揃える
        const size = Math.round(Math.min(vw, vh) * guideRatio);
        const sx = Math.round((vw - size) / 2);
        const sy = Math.round((vh - size) / 2);

        canvas.width = size;
        canvas.height = size;
        ctx.drawImage(video, sx, sy, size, size, 0, 0, size, size);
        const imageData = ctx.getImageData(0, 0, size, size);
        const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'attemptBoth' });
        if (code && code.data) {
          scanning = false;
          onScanned(code.data);
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    function onScanned(value) {
      msg.textContent = '読み取りました: ' + value + '\n受付画面に戻ります…';
      stopCamera();
      if (!returnUrl) return;
      const url = returnUrl
        + '?scanned=' + encodeURIComponent(value)
        + '&dept=' + encodeURIComponent(dept)
        + '&label=' + encodeURIComponent(label);
      setTimeout(function () { location.href = url; }, 500);
    }
  </script>

</body>
</html>
